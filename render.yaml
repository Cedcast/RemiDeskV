# Render Blueprint - B2B Appointment SaaS
# https://render.com/docs/blueprint-spec

services:
  # Backend API Service
  - type: web
    name: appointment-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      cd backend && pip install -r requirements.txt && alembic upgrade head && python -m scripts.seed_superadmin
    startCommand: cd backend && gunicorn src.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: appointment-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SUPERADMIN_EMAIL
        value: admin@remidesk.com
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_NAME
        value: Platform Admin
      # Optional: Add these manually in Render dashboard
      # - key: TWILIO_ACCOUNT_SID
      #   sync: false
      # - key: TWILIO_AUTH_TOKEN
      #   sync: false
      # - key: SENDGRID_API_KEY
      #   sync: false
      # - key: STRIPE_SECRET_KEY
      #   sync: false
    healthCheckPath: /health

  # Frontend Static Site
  - type: web
    name: appointment-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"

# PostgreSQL Database
databases:
  - name: appointment-db
    plan: free
    region: oregon
    databaseName: appointments
    user: appointmentuser
